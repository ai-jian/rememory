        ctx.save(); ctx.translate(r.x + 100 - O.x * 0.3, r.y + 86 - O.y * 0.3); ctx.scale(0.3, 0.3); sh.item === 0 ? watchFront(sh.choice === 'a') : radioFront(sh.choice === 'a'); ctx.restore(); state.mini = false;
        text(it.owner, r.x + 200, r.y + 60, 22, INK, 'left'); text(it.kept[sh.choice], r.x + 200, r.y + 96, 18, GREY, 'left');
        drawSentence(layoutSentence(it.parts, answers(it), r.x + 24, r.y + 190, r.w - 48, 20, 42, 40), 20, true); });
      [state.item, state.side, state.choice] = keep;
      if (state.linkDone) { const a = Math.min(1, state.phaseT / 1.5); ctx.setLineDash([4, 9]); sk(() => { ctx.beginPath(); for (let k = 0; k <= 30 * a; k++) { const u = k / 30, x = 340 + u * 600, y = 470 + Math.sin(u * 3.1416) * 26; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } }, 3, AMBER); ctx.setLineDash([]); }
      drawSentence(layoutSentence(LINK.ask, [state.linkDone ? '老周' : null], 300, 530, 760, 22, 44), 22, state.linkDone);
      if (!state.linkDone) chipRects(LINK.opts, 520, 560, 500).forEach(c => drawChip(c, false, false, 0));
      if (state.linkMsg) para(state.linkMsg, W / 2, state.linkDone ? 590 : 630, 900, state.linkDone ? 24 : 19, state.linkDone ? '#6b3a06' : INK, 1.5, 'center');
      text(state.linkDone ? 'R 重新开张' : '点一个名字', W / 2, 690, 18, GREY); cursor();
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); mouse.clicked = false;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }

    ctx.fillStyle = '#56637e'; rr(26, hh * 0.12, 96, hh * 0.46, 3); ctx.fill(); ctx.save(); rr(26, hh * 0.12, 96, hh * 0.46, 3); ctx.clip(); snow(26, hh * 0.12, 96, hh * 0.46, 22, 0.7); ctx.restore();
    ctx.strokeStyle = '#2a1d18'; ctx.lineWidth = 4; ctx.strokeRect(26, hh * 0.12, 96, hh * 0.46); ctx.beginPath(); ctx.moveTo(74, hh * 0.12); ctx.lineTo(74, hh * 0.58); ctx.stroke();
    const lg = ctx.createRadialGradient(200, hh * 0.6, 4, 200, hh * 0.6, 120); lg.addColorStop(0, 'rgba(255,196,110,0.75)'); lg.addColorStop(1, 'rgba(255,196,110,0)'); ctx.fillStyle = lg; ctx.fillRect(60, 0, 240, hh);
    ctx.fillStyle = '#6a4a36'; ctx.fillRect(130, hh * 0.72, 150, 8); ctx.fillRect(140, hh * 0.72, 8, hh * 0.3); ctx.fillRect(262, hh * 0.72, 8, hh * 0.3);
    ctx.fillStyle = '#9c3f33'; rr(180, hh * 0.72 - 30, 52, 30, 4); ctx.fill(); ctx.fillStyle = '#d9cdb0'; rr(184, hh * 0.72 - 26, 22, 22, 3); ctx.fill(); ctx.fillStyle = '#e9e6dc'; circ(222, hh * 0.72 - 9, 4); ctx.fill();
    ctx.fillStyle = '#231a16'; rr(236, hh * 0.44, 30, 56, 10); ctx.fill(); circ(251, hh * 0.38, 12); ctx.fill(); circ(251, hh * 0.3, 6); ctx.fill(); // the mother
    rr(150, hh * 0.56, 20, 34, 7); ctx.fill(); circ(160, hh * 0.5, 9); ctx.fill(); // the boy
  }
  ctx.fillStyle = 'rgba(238,222,190,0.22)'; ctx.fillRect(0, 0, 300, hh); // fade, like an old print
  ctx.restore();
}
function memoryPanel() {
  const x = 912, y = 88, w = 336, it = item(), n = it.steps.length, k = state.done.length;
  ctx.fillStyle = 'rgba(40,24,16,0.62)'; rr(x - 14, 26, w + 28, 668, 14); ctx.fill();

}

// ---- Drawing: the frame around play --------------------------------------------------------------
function button(r, label, on, sub) {
  ctx.fillStyle = on ? PAL.amber : 'rgba(40,24,16,0.62)'; rr(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = on ? '#fff0c8' : 'rgba(246,239,220,0.35)'; ctx.lineWidth = 2; rr(r.x, r.y, r.w, r.h, 10); ctx.stroke();

function tray() {

    text(t.name, r.x + 108, r.y + 36, 19, on ? PAL.ink : PAL.cream); text(String(i + 1), r.x + 108, r.y + 64, 16, on ? PAL.ink : '#d9c9a8');
    if (glow && ns.tool === t.id && !on) glowRing(r.x + r.w / 2, r.y + r.h / 2, 62);
  });
  button(FLIP, '翻面  F', false); button(HINT, '提示  H', false);
  if (glow && state.tool === ns.tool) {
    if (ns.side !== state.side) glowRing(FLIP.x + FLIP.w / 2, FLIP.y + FLIP.h / 2, 50);
    else if (ns.id === 'wind') glowRing(CROWN.x, CROWN.y, 34); else if (ns.id === 'pry') glowRing(C.x, C.y, 138); else glowRing(C.x, C.y, 112);
  }
}
function talkBar(who, line, more) {
  ctx.fillStyle = 'rgba(30,18,12,0.86)'; rr(214, 584, 680, 112, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(242,176,74,0.5)'; ctx.lineWidth = 2; rr(214, 584, 680, 112, 14); ctx.stroke();
  ctx.save(); rr(214, 584, 110, 112, 14); ctx.clip(); person(who, 270, 646, 0.95); ctx.restore();
  text(who, 340, 608, 18, PAL.amber, 'left'); para(line, 340, 640, 530, 21, PAL.cream, 1.45);

}
function drawItem() {
  if (item().id === 'watch') (state.side === 'front' ? watchFront : watchBack)(); else (state.side === 'front' ? radioFront : radioBack)();
}
function pointer() { return down.has('Space') && state.phase === 'work' && state.autoAt ? state.autoAt : [mouse.x, mouse.y]; }

// ---- Scenes ---------------------------------------------------------------------------------------
const advance = () => pressed('Enter') || pressed('Space') || mouse.clicked;
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      ctx.fillStyle = '#7a4d33'; ctx.fillRect(0, 0, W, H);
      const put = (name, x, fn) => { fn(); text(name, x, 660, 20, PAL.cream); };
      put('周奶奶', 110, () => person('周奶奶', 110, 520, 1.3)); put('小陈', 290, () => person('小陈', 290, 520, 1.3));
      TOOLS.forEach((t, i) => put(t.name, 470 + i * 130, () => drawTool(t.id, 470 + i * 130, 540, 1.4)));
      const save = [state.item, state.side]; state.grid.a.fill(0);
      ctx.save(); ctx.translate(-60, 40); ctx.scale(0.6, 0.6); state.mini = true; state.item = 0; state.side = 'front'; watchFront(); ctx.restore(); state.mini = false; text('手表', 276, 430, 20, PAL.cream); state.mini = true;
      ctx.save(); ctx.translate(430, 40); ctx.scale(0.6, 0.6); state.item = 1; radioFront(); state.mini = false; ctx.restore(); text('收音机', 766, 430, 20, PAL.cream);
      [state.item, state.side] = save;
      memoryScene(0, 1010, 60, 230, 150); text('记忆：雪路', 1125, 232, 20, PAL.cream); memoryScene(1, 1010, 290, 230, 150); text('记忆：等广播', 1125, 462, 20, PAL.cream);
    },
  },
  title: {
    update(dt) { state.t += dt; if (advance()) { reset(); scene = 'play'; sfx.click(); } },
    draw() {
      bench(); motes();
      ctx.fillStyle = 'rgba(30,18,12,0.72)'; rr(250, 110, 780, 500, 20); ctx.fill();
      text(TITLE, W / 2, 200, 66, PAL.cream); text('修一件旧物，留下一段记忆', W / 2, 268, 24, PAL.amber);
      CONTROLS.forEach((c, i) => text(c, W / 2, 350 + i * 44, 22, '#ecdcb8'));
      text('点一下，或按回车，开张', W / 2, 540, 26, `rgba(246,239,220,${0.6 + 0.4 * Math.sin(state.t * 3)})`);
    },
  },
  play: {
    update(dt) {
      state.t += dt; state.phaseT += dt; state.pop = Math.max(0, state.pop - dt * 1.2); state.msgT = Math.max(0, state.msgT - dt);

        if (c) { state.choice = c; state.side = 'front'; state.phase = 'memory'; state.phaseT = 0; sfx.done(); events.push({ choice: it.id + ':' + c }); }
        return;
      }
      if (state.phase === 'memory') { if (state.phaseT > 0.6 && advance()) { state.phase = 'return'; state.line = 0; state.phaseT = 0; sfx.click(); } return; }
      if (state.phase === 'return') {
        if (state.phaseT > 0.3 && advance()) { sfx.click(); state.phaseT = 0;
          if (++state.line >= it.back[state.choice].length) { state.shelf.push({ item: state.item, choice: state.choice }); state.windAt = null;
            if (state.item + 1 < ITEMS.length) startItem(state.item + 1); else { state.gained = '两段记忆，同一场雪'; scene = 'results'; state.phaseT = 0; sfx.done(); } } }
      }
    },
    draw() {
      bench(); drawItem(); motes(); tray(); memoryPanel();
      const it = item();
      if (state.phase === 'arrive') talkBar(it.owner, it.arrive[state.line], '点一下继续');
      else if (state.phase === 'work') {
        if (state.msgT > 0) { ctx.globalAlpha = Math.min(1, state.msgT * 2); ctx.fillStyle = 'rgba(30,18,12,0.86)'; rr(214, 606, 680, 78, 14); ctx.fill(); para(state.msg, 238, 632, 636, 19, PAL.cream, 1.4); ctx.globalAlpha = 1; }
        else if (it.id === 'radio' && isDone('solder') && !isDone('tune') && state.side === 'front') { // the broadcast, clearer the nearer the needle
          const d = Math.abs(state.freq - tune.tune_target), clear = Math.max(0, 1 - d / 160), src = '受大雪影响，纺织厂夜班班车今晚停运。司机陈德山同志已步行护送工人回城';
          let out = ''; for (let i = 0; i < src.length; i++) out += (Math.sin(i * 12.9898 + Math.floor(state.t * 6) * 0.7) * 0.5 + 0.5) < clear ? src[i] : '沙';
          ctx.fillStyle = 'rgba(30,18,12,0.86)'; rr(214, 606, 680, 78, 14); ctx.fill(); para(out, 238, 632, 636, 19, clear > 0.6 ? '#ffe2a8' : '#cdbb98', 1.4);
        } else if (!state.tool) text('从左边拿一件工具', C.x, 640, 20, 'rgba(246,239,220,0.8)');
      } else if (state.phase === 'choice') {
        ctx.fillStyle = 'rgba(30,18,12,0.86)'; rr(C.x - 280, 540, 560, 136, 14); ctx.fill();
        text(it.choice.ask, C.x, 570, 22, PAL.cream); button(CH_A, '1  ' + it.choice.a, false); button(CH_B, '2  ' + it.choice.b, false);
      } else if (state.phase === 'memory') {
        const a = Math.min(1, state.phaseT * 1.5); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(20,12,8,0.86)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = PAL.paper; rr(332, 68, 616, 380, 6); ctx.fill(); memoryScene(state.item, 344, 80, 592, 356);
        para(it.memory, 250, 486, 780, 22, PAL.cream, 1.6); text('这段记忆留在店里了。点一下继续', W / 2, 680, 17, PAL.amber); ctx.globalAlpha = 1;
      } else if (state.phase === 'return') talkBar(it.owner, it.back[state.choice][state.line], '点一下继续');
      if (state.phase === 'work') drawTool(state.tool || 'hand', pointer()[0], pointer()[1] + (state.tool === 'cloth' || !state.tool ? 0 : 30), 1, state.tool === 'driver' || state.tool === 'iron' ? -0.5 : 0);
      else { ctx.fillStyle = PAL.cream; circ(mouse.x, mouse.y, 6); ctx.fill(); ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2; circ(mouse.x, mouse.y, 6); ctx.stroke(); }
      text(muted ? 'M 开声音' : 'M 静音', 34, 700, 15, 'rgba(246,239,220,0.7)', 'left');
    },
  },
  results: { // the shelf: what stays in the shop
    update(dt) { state.t += dt; state.phaseT += dt; if (pressed('KeyR') || (state.phaseT > 1 && pressed('Enter'))) { reset(); scene = 'play'; } },
    draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#4a3226'); g.addColorStop(1, '#2a1a12'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const l = ctx.createRadialGradient(W / 2, 250, 40, W / 2, 250, 620); l.addColorStop(0, 'rgba(255,220,150,0.28)'); l.addColorStop(1, 'rgba(255,220,150,0)'); ctx.fillStyle = l; ctx.fillRect(0, 0, W, H);
      text('店里的架子', W / 2, 54, 34, PAL.cream);
      ctx.fillStyle = '#8a5a3c'; rr(120, 396, 1040, 20, 4); ctx.fill(); ctx.fillStyle = '#5a3a2a'; rr(120, 414, 1040, 8, 3); ctx.fill();
      const keep = [state.item, state.side, state.choice, state.freq];
      state.shelf.forEach((sh, i) => { const cx = 360 + i * 560; state.item = sh.item; state.side = 'front'; state.choice = sh.choice; state.grid.a.fill(0);
        ctx.fillStyle = PAL.paper; rr(cx - 150, 84, 300, 186, 4); ctx.fill(); memoryScene(sh.item, cx - 142, 92, 284, 170);
        ctx.save(); ctx.translate(cx - C.x * 0.3, 352 - C.y * 0.3 - (sh.item === 0 ? 0 : 0)); ctx.scale(0.3, 0.3); state.mini = true; (sh.item === 0 ? watchFront : radioFront)(); state.mini = false; ctx.restore();
        text(ITEMS[sh.item].owner + ' · ' + ITEMS[sh.item].kept[sh.choice], cx, 446, 19, '#ecdcb8'); });
      [state.item, state.side, state.choice, state.freq] = keep;
      if (state.shelf.length > 1) { const a = Math.min(1, state.phaseT / 2); ctx.strokeStyle = PAL.amber; ctx.lineWidth = 3; ctx.setLineDash([3, 9]); ctx.lineCap = 'round'; ctx.beginPath();
        for (let k = 0; k <= 40 * a; k++) { const u = k / 40, x = 510 + u * 260, y = 176 - Math.sin(u * 3.1416) * 46; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]); ctx.lineCap = 'butt';
        ctx.globalAlpha = Math.max(0, Math.min(1, state.phaseT - 1.6)); text('同一场雪', W / 2, 110, 22, PAL.amber); para(LINK, W / 2, 506, 860, 24, PAL.cream, 1.6, 'center'); ctx.globalAlpha = 1; }
      text('R 重新开张', W / 2, 672, 20, '#d9c9a8');
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); mouse.clicked = false; mouse.moved = 0; mouse.dx = 0; mouse.dy = 0;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
